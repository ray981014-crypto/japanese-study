
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文五十音大挑戰 - 優化版</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #f8f5f0;
      --bg-secondary: #ede8e0;
      --card-bg: #faf7f2;
      --accent-warm: #d4a574;
      --accent-dark: #6b4423;
      --text-primary: #2c2416;
      --text-secondary: #5a4a3a;
      --success-color: #5d8b6f;
      --error-color: #c85a5a;
      --warning-color: #d4a574;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.15);
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: rgba(250, 247, 242, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾線 */
    .app-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-warm), var(--accent-dark));
    }

    /* 計時條 */
    .timer-container {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    #timer-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-warm), var(--accent-dark));
      width: 100%;
      transition: width linear;
      border-radius: 3px;
    }

    /* 標題 */
    h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--accent-dark);
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* 統計信息 */
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: rgba(212, 165, 116, 0.08);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .stats-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .stat-label {
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 15px;
      font-weight: 900;
      color: var(--accent-dark);
    }

    .stat-correct {
      color: var(--success-color);
    }

    .stat-wrong {
      color: var(--error-color);
    }

    /* 按鈕組 */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 16px;
      transition: all var(--transition-fast);
      background: rgba(212, 165, 116, 0.15);
      color: var(--accent-dark);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    button:hover:not(:disabled) {
      background: rgba(212, 165, 116, 0.25);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button.active {
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-dark));
      color: white;
      box-shadow: 0 4px 12px rgba(107, 68, 35, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 難度選擇 */
    .difficulty-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .difficulty-btn {
      padding: 8px 12px;
      font-size: 12px;
    }

    /* 顯示區域 */
    .display-area {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.3));
      border-radius: 20px;
      padding: 32px 24px;
      margin-bottom: 24px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .kana-display {
      font-size: 100px;
      font-weight: 900;
      color: var(--text-primary);
      text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8), 4px 4px 12px rgba(0, 0, 0, 0.1);
      line-height: 1;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .replay-btn {
      background: var(--accent-dark);
      color: white;
      padding: 8px 16px;
      font-size: 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      animation: fadeIn 0.3s ease 0.2s forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 選項網格 */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      padding: 20px 16px;
      font-size: 16px;
      font-weight: 900;
      background: rgba(250, 247, 242, 0.8);
      color: var(--accent-dark);
      border-radius: 14px;
      border: 2px solid transparent;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(250, 247, 242, 1);
      border-color: var(--accent-warm);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .option-btn.correct {
      background: var(--success-color);
      color: white;
      border-color: var(--success-color);
      animation: pulse 0.4s ease;
    }

    .option-btn.incorrect {
      background: var(--error-color);
      color: white;
      border-color: var(--error-color);
      animation: shake 0.4s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* 打字輸入 */
    .typing-input-wrapper {
      margin-bottom: 20px;
      display: none;
    }

    .typing-input-wrapper.active {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #typing-input {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      border: 3px solid var(--accent-warm);
      border-radius: 12px;
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-primary);
      transition: all var(--transition-fast);
      font-family: inherit;
    }

    #typing-input:focus {
      outline: none;
      border-color: var(--accent-dark);
      background: white;
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
    }

    #typing-input::placeholder {
      color: rgba(107, 68, 35, 0.4);
    }

    /* 結果提示 */
    .result-message {
      min-height: 32px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      animation: slideIn 0.3s ease;
    }

    .result-message.success {
      color: var(--success-color);
    }

    .result-message.error {
      color: var(--error-color);
    }

    .result-message.timeout {
      color: var(--warning-color);
    }

    /* 下一題按鈕 */
    .next-button-wrapper {
      display: none;
      margin-bottom: 16px;
    }

    .next-button-wrapper.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .next-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-dark));
      color: white;
      border-radius: 12px;
      font-weight: 700;
      transition: all var(--transition-fast);
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(107, 68, 35, 0.3);
    }

    /* 結算畫面 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(43, 32, 20, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-content h2 {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-dark);
      margin-bottom: 24px;
    }

    .result-stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 32px;
      gap: 16px;
    }

    .result-stat {
      flex: 1;
      padding: 16px;
      background: rgba(212, 165, 116, 0.1);
      border-radius: 12px;
    }

    .result-stat-value {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .result-stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .result-stat.correct .result-stat-value {
      color: var(--success-color);
    }

    .result-stat.wrong .result-stat-value {
      color: var(--error-color);
    }

    .result-accuracy {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 600;
    }

    .modal-content button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-dark));
      color: white;
      border-radius: 12px;
      font-weight: 700;
      transition: all var(--transition-fast);
    }

    .modal-content button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(107, 68, 35, 0.3);
    }

    /* 響應式設計 */
    @media (max-width: 480px) {
      .app-container {
        padding: 24px 16px;
      }

      h1 {
        font-size: 24px;
      }

      .kana-display {
        font-size: 80px;
        min-height: 90px;
      }

      .display-area {
        padding: 24px 16px;
        min-height: 140px;
      }

      .option-btn {
        padding: 16px 12px;
        font-size: 14px;
      }

      .modal-content {
        padding: 32px 24px;
      }

      .modal-content h2 {
        font-size: 28px;
      }
    }

    /* 無障礙設計 */
    button:focus-visible {
      outline: 2px solid var(--accent-dark);
      outline-offset: 2px;
    }

    #typing-input:focus-visible {
      outline: none;
    }

    /* 打印樣式 */
    @media print {
      body {
        background: white;
      }
      .app-container {
        box-shadow: none;
        border: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 計時條 -->
  <div class="timer-container">
    <div id="timer-bar"></div>
  </div>

  <!-- 標題 -->
  <h1>日文五十音大挑戰</h1>
  <div class="subtitle">掌握日語基礎，挑戰自己的極限</div>

  <!-- 統計信息 -->
  <div class="stats-row">
    <div class="stats-item">
      <span class="stat-label">進度:</span>
      <span class="stat-value" id="progress-text">0 / 46</span>
    </div>
    <div class="stats-item">
      <span>✅</span>
      <span class="stat-value stat-correct" id="stat-correct">0</span>
      <span class="stat-label">/</span>
      <span>❌</span>
      <span class="stat-value stat-wrong" id="stat-wrong">0</span>
    </div>
  </div>

  <!-- 模式選擇 -->
  <div class="button-group">
    <button id="mode-hiragana" class="active" onclick="updateMode('hiragana')">平假名</button>
    <button id="mode-katakana" onclick="updateMode('katakana')">片假名</button>
    <button id="mode-both" onclick="updateMode('both')">混合</button>
  </div>

  <!-- 功能選擇 -->
  <div class="button-group">
    <button id="func-typing" onclick="updateFunc('typing')">✍️ 打字</button>
    <button id="func-listening" onclick="updateFunc('listening')">🔊 聽力</button>
  </div>

  <!-- 難度選擇 -->
  <div class="button-group difficulty-group">
    <button class="difficulty-btn active" onclick="updateDifficulty('easy')" data-difficulty="easy">簡單 (10秒)</button>
    <button class="difficulty-btn" onclick="updateDifficulty('normal')" data-difficulty="normal">普通 (5秒)</button>
    <button class="difficulty-btn" onclick="updateDifficulty('hard')" data-difficulty="hard">困難 (3秒)</button>
  </div>

  <!-- 顯示區域 -->
  <div class="display-area">
    <div class="kana-display" id="kana">...</div>
    <button class="replay-btn" id="replay-btn" onclick="replayVoice()" style="display: none;">🔁 重聽</button>
  </div>

  <!-- 選項網格 -->
  <div class="options-grid" id="options-grid"></div>

  <!-- 打字輸入 -->
  <div class="typing-input-wrapper" id="typing-wrapper">
    <input 
      id="typing-input" 
      type="text" 
      placeholder="輸入羅馬字..." 
      autocomplete="off"
      spellcheck="false"
    >
  </div>

  <!-- 結果提示 -->
  <div class="result-message" id="result-message"></div>

  <!-- 下一題按鈕 -->
  <div class="next-button-wrapper" id="next-button-wrapper">
    <button class="next-btn" onclick="nextQuestion()">下一題 →</button>
  </div>
</div>

<!-- 結算畫面 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content">
    <h2>挑戰完成！</h2>
    <div class="result-stats">
      <div class="result-stat correct">
        <div class="result-stat-value" id="final-correct">0</div>
        <div class="result-stat-label">正確</div>
      </div>
      <div class="result-stat wrong">
        <div class="result-stat-value" id="final-wrong">0</div>
        <div class="result-stat-label">錯誤</div>
      </div>
    </div>
    <div class="result-accuracy" id="accuracy-text">正確率: 0%</div>
    <button onclick="restartChallenge()">🔄 重新挑戰</button>
  </div>
</div>

<script>
  // ==================== 數據定義 ====================
  const KANA_DATA = [
    ['あ','ア','a'],['い','イ','i'],['う','ウ','u'],['え','エ','e'],['お','オ','o'],
    ['か','カ','ka'],['き','キ','ki'],['く','ク','ku'],['け','ケ','ke'],['こ','コ','ko'],
    ['さ','サ','sa'],['し','シ','shi'],['す','ス','su'],['せ','セ','se'],['そ','ソ','so'],
    ['た','タ','ta'],['ち','チ','chi'],['つ','ツ','tsu'],['て','テ','te'],['と','ト','to'],
    ['な','ナ','na'],['に','ニ','ni'],['ぬ','ヌ','nu'],['ね','ネ','ne'],['の','ノ','no'],
    ['は','ハ','ha'],['ひ','ヒ','hi'],['ふ','フ','fu'],['へ','ヘ','he'],['ほ','ホ','ho'],
    ['ま','マ','ma'],['み','ミ','mi'],['む','ム','mu'],['め','メ','me'],['も','モ','mo'],
    ['や','ヤ','ya'],['ゆ','ユ','yu'],['よ','ヨ','yo'],
    ['ら','ラ','ra'],['り','リ','ri'],['る','ル','ru'],['れ','レ','re'],['ろ','ロ','ro'],
    ['わ','ワ','wa'],['を','ヲ','wo'],['ん','ン','n']
  ];

  const DIFFICULTY_SETTINGS = {
    easy: { timeLimit: 10000, label: '簡單' },
    normal: { timeLimit: 5000, label: '普通' },
    hard: { timeLimit: 3000, label: '困難' }
  };

  // ==================== 狀態管理 ====================
  let state = {
    charMode: 'hiragana',
    isTyping: false,
    isListening: false,
    difficulty: 'normal',
    current: null,
    pool: [],
    correctCount: 0,
    wrongCount: 0,
    timer: null,
    timeLeft: 5000,
    currentTimeLimit: 5000,
    isAnswering: false,
    stats: {
      sessionTotal: 0,
      totalCorrect: 0,
      totalWrong: 0
    }
  };

  // ==================== 工具函數 ====================
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function clearTimer() {
    if (state.timer) {
      clearTimeout(state.timer);
      state.timer = null;
    }
  }

  function updateStats() {
    document.getElementById('stat-correct').textContent = state.correctCount;
    document.getElementById('stat-wrong').textContent = state.wrongCount;
    document.getElementById('progress-text').textContent = 
      `${KANA_DATA.length - state.pool.length} / ${KANA_DATA.length}`;
  }

  // ==================== 音效函數 ====================
  function playSuccessSound() {
    // 使用 Web Audio API 生成成功音效
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioContext.currentTime;
      
      // 創建振盪器
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      // 成功音：兩個上升的音調
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.setValueAtTime(1200, now + 0.1);
      
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      
      osc.start(now);
      osc.stop(now + 0.2);
    } catch (e) {
      console.log('音效播放失敗');
    }
  }

  function playErrorSound() {
    // 使用 Web Audio API 生成錯誤音效
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioContext.currentTime;
      
      // 創建振盪器
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      // 錯誤音：下降的音調
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.setValueAtTime(300, now + 0.2);
      
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      
      osc.start(now);
      osc.stop(now + 0.2);
    } catch (e) {
      console.log('音效播放失敗');
    }
  }

  // ==================== 模式管理 ====================
  function updateMode(mode) {
    state.charMode = mode;
    document.querySelectorAll('#mode-hiragana, #mode-katakana, #mode-both').forEach(b => 
      b.classList.remove('active')
    );
    document.getElementById(`mode-${mode}`).classList.add('active');
    restartChallenge();
  }

  function updateFunc(type) {
    const key = `is${type.charAt(0).toUpperCase() + type.slice(1)}`;
    state[key] = !state[key];
    document.getElementById(`func-${type}`).classList.toggle('active');
    restartChallenge();
  }

  function updateDifficulty(difficulty) {
    state.difficulty = difficulty;
    state.currentTimeLimit = DIFFICULTY_SETTINGS[difficulty].timeLimit;
    document.querySelectorAll('.difficulty-btn').forEach(b => 
      b.classList.remove('active')
    );
    document.querySelector(`[data-difficulty="${difficulty}"]`).classList.add('active');
    restartChallenge();
  }

  // ==================== 遊戲邏輯 ====================
  function restartChallenge() {
    state.correctCount = 0;
    state.wrongCount = 0;
    state.pool = shuffle([...KANA_DATA]);
    state.stats.sessionTotal = KANA_DATA.length;
    updateStats();
    document.getElementById('modal-overlay').classList.remove('active');
    clearTimer();
    generateQuestion();
  }

  function startTimer() {
    clearTimer();
    const bar = document.getElementById('timer-bar');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    
    setTimeout(() => {
      bar.style.transition = `width ${state.currentTimeLimit}ms linear`;
      bar.style.width = '0%';
    }, 10);

    state.timer = setTimeout(() => {
      checkAnswer(false, true);
    }, state.currentTimeLimit);
  }

  function generateQuestion() {
    if (state.pool.length === 0) {
      showFinalResult();
      return;
    }
    
    state.current = state.pool.pop();
    state.isAnswering = false;
    updateStats();
    
    // 隱藏下一題按鈕
    document.getElementById('next-button-wrapper').classList.remove('show');
    document.getElementById('result-message').textContent = '';
    
    const kanaDiv = document.getElementById('kana');
    const replayBtn = document.getElementById('replay-btn');
    
    if (state.isListening) {
      kanaDiv.textContent = '🔊';
      replayBtn.style.display = 'inline-flex';
      playVoice(state.current[0]);
    } else {
      replayBtn.style.display = 'none';
      let char = state.current[0];
      if (state.charMode === 'katakana') char = state.current[1];
      if (state.charMode === 'both') char = Math.random() > 0.5 ? state.current[0] : state.current[1];
      kanaDiv.textContent = char;
    }

    if (state.isTyping) {
      document.getElementById('typing-wrapper').classList.add('active');
      document.getElementById('options-grid').innerHTML = '';
      const input = document.getElementById('typing-input');
      input.value = '';
      input.focus();
      input.disabled = false;
    } else {
      document.getElementById('typing-wrapper').classList.remove('active');
      renderOptions();
    }
    
    startTimer();
  }

  function renderOptions() {
    let options = [state.current];
    while (options.length < 4) {
      const random = KANA_DATA[Math.floor(Math.random() * KANA_DATA.length)];
      if (!options.some(o => o[2] === random[2])) {
        options.push(random);
      }
    }
    options = shuffle(options);
    
    const container = document.getElementById('options-grid');
    container.innerHTML = '';
    options.forEach(option => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = option[2];
      btn.disabled = false;
      btn.onclick = () => {
        if (!state.isAnswering) {
          checkAnswer(option[2] === state.current[2]);
        }
      };
      container.appendChild(btn);
    });
  }

  function checkAnswer(isCorrect, isTimeout = false) {
    if (state.isAnswering) return;
    state.isAnswering = true;
    
    clearTimer();
    const resultDiv = document.getElementById('result-message');
    
    if (isCorrect) {
      state.correctCount++;
      playSuccessSound();
      resultDiv.className = 'result-message success';
      resultDiv.textContent = '✨ 正確！';
      
      // 高亮正確答案
      if (!state.isTyping) {
        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.disabled = true;
          if (btn.textContent === state.current[2]) {
            btn.classList.add('correct');
          }
        });
      } else {
        document.getElementById('typing-input').disabled = true;
      }
    } else {
      state.wrongCount++;
      playErrorSound();
      if (isTimeout) {
        resultDiv.className = 'result-message timeout';
        resultDiv.textContent = `⏰ 超時！正確是 ${state.current[2]}`;
      } else {
        resultDiv.className = 'result-message error';
        resultDiv.textContent = `❌ 錯誤！正確是 ${state.current[2]}`;
      }
      
      // 高亮正確答案
      if (!state.isTyping) {
        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.disabled = true;
          if (btn.textContent === state.current[2]) {
            btn.classList.add('correct');
          } else if (btn.classList.contains('selected')) {
            btn.classList.add('incorrect');
          }
        });
      } else {
        document.getElementById('typing-input').disabled = true;
      }
    }
    
    updateStats();
    
    // 顯示下一題按鈕
    setTimeout(() => {
      document.getElementById('next-button-wrapper').classList.add('show');
    }, 300);
  }

  function nextQuestion() {
    generateQuestion();
  }

  function showFinalResult() {
    const total = state.correctCount + state.wrongCount;
    const accuracy = total > 0 ? Math.round((state.correctCount / total) * 100) : 0;
    
    document.getElementById('final-correct').textContent = state.correctCount;
    document.getElementById('final-wrong').textContent = state.wrongCount;
    document.getElementById('accuracy-text').textContent = `正確率: ${accuracy}%`;
    document.getElementById('modal-overlay').classList.add('active');
  }

  // ==================== 語音功能 ====================
  function playVoice(text) {
    try {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.4;
      utterance.pitch = 1;
      utterance.volume = 1;
      
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    } catch (error) {
      console.error('語音播放錯誤:', error);
    }
  }

  function replayVoice() {
    if (state.current) {
      playVoice(state.current[0]);
    }
  }

  // ==================== 打字輸入事件 ====================
  document.getElementById('typing-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !state.isAnswering) {
      const input = e.target.value.toLowerCase().trim();
      const isCorrect = validateTypingAnswer(input);
      checkAnswer(isCorrect);
    }
  });

  function validateTypingAnswer(input) {
    const correct = state.current[2];
    
    // 精確匹配
    if (input === correct) return true;
    
    // 常見變體
    const variants = {
      'shi': ['si'],
      'chi': ['ti'],
      'tsu': ['tu'],
      'fu': ['hu'],
      'wo': ['o']
    };
    
    if (variants[correct] && variants[correct].includes(input)) {
      return true;
    }
    
    return false;
  }

  // ==================== 初始化 ====================
  document.addEventListener('DOMContentLoaded', () => {
    restartChallenge();
  });

  // ==================== 鍵盤快捷鍵 ====================
  document.addEventListener('keydown', (e) => {
    // 數字鍵 1-4 選擇選項
    if (!state.isTyping && state.pool.length > 0 && !state.isAnswering) {
      const num = parseInt(e.key);
      if (num >= 1 && num <= 4) {
        const buttons = document.querySelectorAll('.option-btn');
        if (buttons[num - 1]) {
          buttons[num - 1].click();
        }
      }
    }
  });
</script>

</body>
</html>
