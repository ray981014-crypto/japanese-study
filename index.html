<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日文五十音大挑戰 - 限時版</title>

<style>
  :root {
    --bg: #f3e5dc;
    --card: #e6d5c9;
    --accent: #5d4037;
    --primary: #cdaa91;
    --text-main: #3e2723;
    --success: #6d8b74;
    --error: #b85c5c;
  }

  body {
    background: radial-gradient(circle at top, #faf3ed, var(--bg));
    color: var(--text-main);
    font-family: 'Helvetica Neue', 'Arial', 'Microsoft JhengHei', sans-serif;
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }

  .container {
    background: rgba(230, 213, 201, 0.9);
    backdrop-filter: blur(10px);
    border: 3px solid rgba(255, 255, 255, 0.5);
    border-radius: 30px;
    width: 100%; max-width: 450px;
    padding: 25px; box-shadow: 0 20px 40px rgba(62, 39, 35, 0.15);
    text-align: center; position: relative;
    overflow: hidden;
  }

  /* 計時條 */
  .timer-bar-bg {
    width: 100%; height: 6px; background: rgba(0,0,0,0.05);
    position: absolute; top: 0; left: 0;
  }
  #timer-bar {
    width: 100%; height: 100%; background: var(--accent);
    transition: width linear;
  }

  h1 { font-size: 1.6rem; font-weight: 900; color: var(--accent); margin: 10px 0; }
  
  .stats-group {
    display: flex; justify-content: space-between;
    margin-bottom: 15px; font-weight: 800; font-size: 0.9rem; color: var(--accent);
  }

  .button-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  button {
    cursor: pointer; transition: all 0.2s; border: none;
    border-radius: 12px; background: var(--primary); color: white;
    padding: 8px 14px; font-size: 0.9rem; font-weight: 800;
  }
  button.active { background: var(--accent); box-shadow: 0 4px 10px rgba(93,64,55,0.3); }

  .display-area {
    background: rgba(255, 255, 255, 0.5); border-radius: 24px;
    margin: 15px 0; padding: 25px; border: 2px solid rgba(255,255,255,0.8);
  }

  .kana {
    font-size: 110px; height: 130px; display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: var(--text-main);
    text-shadow: 2px 2px 0px white, 4px 4px 15px rgba(0,0,0,0.1);
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option-btn {
    padding: 18px; border-radius: 18px; font-size: 1.4rem; font-weight: 900;
    background: #fdf6f0; color: var(--accent); box-shadow: 0 4px 8px rgba(0,0,0,0.05);
  }

  input {
    padding: 15px; border-radius: 15px; border: 4px solid var(--primary);
    width: 80%; font-size: 1.6rem; font-weight: 900; text-align: center; outline: none;
  }

  #result { margin-top: 15px; height: 30px; font-weight: 800; font-size: 1.2rem; }

  /* 結算畫面 */
  #overlay {
    display: none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(93, 64, 55, 0.9); z-index: 100;
    flex-direction: column; justify-content: center; align-items: center; color: white;
  }
  #overlay h2 { font-size: 2.5rem; margin-bottom: 10px; }
  #overlay p { font-size: 1.5rem; margin: 5px; }
</style>
</head>
<body>

<div id="overlay">
  <h2>挑戰結束</h2>
  <p id="final-correct">正確：0</p>
  <p id="final-wrong">錯誤：0</p>
  <button onclick="restartChallenge()" style="margin-top:20px; padding:15px 40px; font-size:1.2rem; background:var(--primary)">重新挑戰</button>
</div>

<div class="container">
  <div class="timer-bar-bg"><div id="timer-bar"></div></div>
  
  <h1>日文五十音大挑戰</h1>

  <div class="stats-group">
    <span id="progress-text">題數: 0 / 46</span>
    <span>✅ <span id="stat-correct" style="color:var(--success)">0</span> / ❌ <span id="stat-wrong" style="color:var(--error)">0</span></span>
  </div>

  <div class="button-group">
    <button id="mode-hiragana" class="active" onclick="updateMode('hiragana')">平假名</button>
    <button id="mode-katakana" onclick="updateMode('katakana')">片假名</button>
    <button id="mode-both" onclick="updateMode('both')">混合</button>
    <button id="func-typing" onclick="updateFunc('typing')">✍️ 打字</button>
    <button id="func-listening" onclick="updateFunc('listening')">🔊 聽力</button>
  </div>

  <div class="display-area">
    <div class="kana" id="kana">...</div>
    <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
      <button onclick="replayVoice()" style="background:#8d7765; padding:5px 15px;">🔁 重聽</button>
    </div>
  </div>

  <div id="options" class="grid"></div>
  <div id="typingBox" style="display:none">
    <input id="typingInput" placeholder="..." autocomplete="off">
  </div>

  <div id="result"></div>
</div>

<script>
const fullData = [
  ['あ','ア','a'],['い','イ','i'],['う','ウ','u'],['え','エ','e'],['お','オ','o'],
  ['か','カ','ka'],['き','キ','ki'],['く','ク','ku'],['け','ケ','ke'],['こ','コ','ko'],
  ['さ','サ','sa'],['し','シ','shi'],['す','ス','su'],['せ','セ','se'],['そ','ソ','so'],
  ['た','タ','ta'],['ち','チ','chi'],['つ','ツ','tsu'],['て','テ','te'],['と','ト','to'],
  ['な','ナ','na'],['に','ニ','ni'],['ぬ','ヌ','nu'],['ね','ネ','ne'],['の','ノ','no'],
  ['は','ハ','ha'],['ひ','ヒ','hi'],['ふ','フ','fu'],['へ','ヘ','he'],['ほ','ホ','ho'],
  ['ま','馬','ma'],['み','ミ','mi'],['む','ム','mu'],['め','メ','me'],['も','モ','mo'],
  ['や','ヤ','ya'],['ゆ','ユ','yu'],['よ','ヨ','yo'],
  ['ら','ラ','ra'],['り','リ','ri'],['る','ル','ru'],['れ','レ','re'],['ろ','ロ','ro'],
  ['わ','ワ','wa'],['を','ヲ','wo'],['ん','ン','n']
];

let state = {
  charMode: 'hiragana', isTyping: false, isListening: false,
  current: null, pool: [], 
  correctCount: 0, wrongCount: 0,
  timer: null, timeLeft: 5000, limit: 5000 // 每一題 5 秒
};

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function updateMode(m) {
  state.charMode = m;
  document.querySelectorAll('.button-group button').forEach(b => b.classList.remove('active'));
  document.getElementById(`mode-${m}`).classList.add('active');
  restartChallenge();
}

function updateFunc(type) {
  state[`is${type.charAt(0).toUpperCase() + type.slice(1)}`] = !state[`is${type.charAt(0).toUpperCase() + type.slice(1)}`];
  document.getElementById(`func-${type}`).classList.toggle('active');
  restartChallenge();
}

function restartChallenge() {
  state.correctCount = 0; state.wrongCount = 0;
  state.pool = shuffle([...fullData]);
  updateStats();
  document.getElementById('overlay').style.display = 'none';
  generateQuestion();
}

function updateStats() {
  document.getElementById('stat-correct').textContent = state.correctCount;
  document.getElementById('stat-wrong').textContent = state.wrongCount;
  document.getElementById('progress-text').textContent = `題數: ${fullData.length - state.pool.length} / ${fullData.length}`;
}

function startTimer() {
  clearInterval(state.timer);
  const bar = document.getElementById('timer-bar');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  
  setTimeout(() => {
    bar.style.transition = `width ${state.limit}ms linear`;
    bar.style.width = '0%';
  }, 10);

  state.timer = setTimeout(() => {
    checkAnswer(false, true); // 超時算錯
  }, state.limit);
}

function generateQuestion() {
  if (state.pool.length === 0) {
    showFinalResult();
    return;
  }
  
  state.current = state.pool.pop();
  updateStats();
  
  const kanaDiv = document.getElementById('kana');
  if (state.isListening) {
    kanaDiv.textContent = '🔊';
    playVoice(state.current[0]);
  } else {
    let char = state.current[0];
    if (state.charMode === 'katakana') char = state.current[1];
    if (state.charMode === 'both') char = Math.random() > 0.5 ? state.current[0] : state.current[1];
    kanaDiv.textContent = char;
  }

  if (state.isTyping) {
    document.getElementById('typingBox').style.display = 'block';
    document.getElementById('options').style.display = 'none';
    const input = document.getElementById('typingInput');
    input.value = ''; input.focus();
  } else {
    document.getElementById('typingBox').style.display = 'none';
    document.getElementById('options').style.display = 'grid';
    renderOptions();
  }
  document.getElementById('result').textContent = '';
  startTimer();
}

function renderOptions() {
  let opts = [state.current];
  while(opts.length < 4) {
    const r = fullData[Math.floor(Math.random() * fullData.length)];
    if(!opts.some(o => o[2] === r[2])) opts.push(r);
  }
  shuffle(opts);
  const container = document.getElementById('options');
  container.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = o[2];
    b.onclick = () => checkAnswer(o[2] === state.current[2]);
    container.appendChild(b);
  });
}

function checkAnswer(isCorrect, isTimeout = false) {
  clearInterval(state.timer);
  const res = document.getElementById('result');
  
  if (isCorrect) {
    state.correctCount++;
    res.innerHTML = `<span style="color:var(--success)">✨ 正確！</span>`;
    setTimeout(generateQuestion, 600);
  } else {
    state.wrongCount++;
    res.innerHTML = isTimeout ? 
      `<span style="color:var(--error)">⏰ 超時！正確是 ${state.current[2]}</span>` : 
      `<span style="color:var(--error)">❌ 錯誤！正確是 ${state.current[2]}</span>`;
    setTimeout(generateQuestion, 1200);
  }
}

function showFinalResult() {
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('final-correct').textContent = `正確：${state.correctCount}`;
  document.getElementById('final-wrong').textContent = `錯誤：${state.wrongCount}`;
}

function playVoice(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.4;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function replayVoice() { if(state.current) playVoice(state.current[0]); }

document.getElementById('typingInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const input = e.target.value.toLowerCase().trim();
    checkAnswer(input === state.current[2] || (state.current[2] === 'shi' && input === 'si') || (state.current[2] === 'chi' && input === 'ti') || (state.current[2] === 'tsu' && input === 'tu'));
  }
});

restartChallenge();
</script>
</body>
</html>
