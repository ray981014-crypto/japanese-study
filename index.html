<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日文五十音大挑戰 - 手機優化版</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 移除手機點擊藍色陰影 */
    }

    :root {
      --bg-primary: #f8f5f0;
      --bg-secondary: #ede8e0;
      --card-bg: #faf7f2;
      --accent-warm: #d4a574;
      --accent-dark: #6b4423;
      --text-primary: #2c2416;
      --text-secondary: #5a4a3a;
      --success-color: #5d8b6f;
      --error-color: #c85a5a;
      --warning-color: #d4a574;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.15);
      --transition-fast: 0.15s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100dvh; /* 使用動態視窗高度，防止手機網址列遮擋 */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden; /* 防止主頁面捲動 */
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 900px;
      background: rgba(250, 247, 242, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 頂部進度條 */
    .timer-container {
      width: 100%;
      height: 4px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 2px;
      margin-bottom: 16px;
    }

    #timer-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-warm), var(--accent-dark));
      width: 100%;
      transition: width linear;
    }

    /* 標題區域縮小 */
    h1 {
      font-size: 20px;
      font-weight: 900;
      color: var(--accent-dark);
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 12px;
    }

    /* 統計資訊 */
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: rgba(212, 165, 116, 0.08);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .stat-value { font-size: 14px; font-weight: 900; }
    .stat-correct { color: var(--success-color); }
    .stat-wrong { color: var(--error-color); }

    /* 按鈕群組優化 */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      justify-content: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 12px;
      transition: all var(--transition-fast);
      background: rgba(212, 165, 116, 0.15);
      color: var(--accent-dark);
    }

    button.active {
      background: var(--accent-dark);
      color: white;
    }

    /* 難度按鈕單獨一行 */
    .difficulty-group .difficulty-btn {
      flex: 1;
      padding: 6px 4px;
      font-size: 11px;
    }

    /* 遊戲控制區 */
    .game-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      border-radius: 10px;
      color: white;
    }

    .ctrl-btn-start { background: var(--success-color); }
    .ctrl-btn-pause { background: var(--accent-warm); }
    .ctrl-btn-restart { background: var(--error-color); }

    /* 顯示區域 - 核心視覺區 */
    .display-area {
      flex-grow: 1;
      background: white;
      border-radius: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(212, 165, 116, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 120px;
    }

    .kana-display {
      font-size: 72px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1;
    }

    /* 選項網格 - 優化手機點擊 */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .option-btn {
      padding: 18px 10px;
      font-size: 18px;
      background: white;
      border: 2px solid #eee;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }

    .option-btn.correct { background: var(--success-color); color: white; border-color: var(--success-color); }
    .option-btn.incorrect { background: var(--error-color); color: white; border-color: var(--error-color); }

    /* 打字模式 */
    #typing-input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid var(--accent-warm);
      border-radius: 12px;
      text-align: center;
      margin-bottom: 12px;
    }

    /* 結果提示與下一題 */
    .result-message {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      height: 20px;
      margin-bottom: 8px;
    }

    .next-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-dark);
      color: white;
      border-radius: 10px;
      font-size: 15px;
    }

    /* 遮罩樣式調整 */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(250, 247, 242, 0.98);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .overlay.active { display: flex; }
    .overlay-icon { font-size: 48px; margin-bottom: 16px; }
    .overlay-title { font-size: 20px; font-weight: 900; margin-bottom: 8px; }

    /* 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    @media (max-height: 600px) {
      .kana-display { font-size: 50px; }
      .option-btn { padding: 12px 10px; }
      h1 { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="overlay active" id="start-overlay">
    <div class="overlay-icon">🎌</div>
    <div class="overlay-title">準備好了嗎？</div>
    <button class="next-btn" style="width: 70%;" onclick="startGame()">▶ 開始挑戰</button>
  </div>

  <div class="overlay" id="pause-overlay">
    <div class="overlay-icon">⏸️</div>
    <div class="overlay-title">遊戲暫停中</div>
    <button class="next-btn" style="width: 70%;" onclick="togglePause()">▶ 繼續遊戲</button>
  </div>

  <div class="timer-container">
    <div id="timer-bar"></div>
  </div>

  <h1>日文五十音挑戰</h1>
  <div class="subtitle">練就瞬間反應的直覺</div>

  <div class="stats-row">
    <div>進度: <span class="stat-value" id="progress-text">0 / 46</span></div>
    <div>
      ✅ <span class="stat-value stat-correct" id="stat-correct">0</span>
      ❌ <span class="stat-value stat-wrong" id="stat-wrong">0</span>
    </div>
  </div>

  <div class="button-group">
    <button id="mode-hiragana" class="active" onclick="updateMode('hiragana')">平假名</button>
    <button id="mode-katakana" onclick="updateMode('katakana')">片假名</button>
    <button id="mode-both" onclick="updateMode('both')">混合</button>
  </div>

  <div class="button-group">
    <button id="func-typing" onclick="updateFunc('typing')">✍️ 打字</button>
    <button id="func-listening" onclick="updateFunc('listening')">🔊 聽力</button>
  </div>

  <div class="button-group difficulty-group">
    <button class="difficulty-btn active" onclick="updateDifficulty('easy')" data-difficulty="easy">10s</button>
    <button class="difficulty-btn" onclick="updateDifficulty('normal')" data-difficulty="normal">5s</button>
    <button class="difficulty-btn" onclick="updateDifficulty('hard')" data-difficulty="hard">3s</button>
  </div>

  <div class="game-controls">
    <button class="ctrl-btn ctrl-btn-pause" id="btn-pause" onclick="togglePause()" disabled>暫停</button>
    <button class="ctrl-btn ctrl-btn-restart" onclick="restartChallenge()">重新</button>
  </div>

  <div class="display-area">
    <div class="kana-display" id="kana">?</div>
    <button id="replay-btn" onclick="replayVoice()" style="margin-top: 10px; font-size: 11px; display: none;">🔊 重播放</button>
  </div>

  <div id="options-grid" class="options-grid"></div>

  <div id="typing-wrapper" style="display: none;">
    <input id="typing-input" type="text" placeholder="輸入羅馬字..." autocomplete="off">
  </div>

  <div class="result-message" id="result-message"></div>

  <div id="next-button-wrapper" style="visibility: hidden;">
    <button class="next-btn" onclick="nextQuestion()">下一題 →</button>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content">
    <h2 style="margin-bottom: 20px;">挑戰完成！</h2>
    <div style="font-size: 18px; margin-bottom: 10px;">正確: <span id="final-correct" class="stat-correct">0</span></div>
    <div style="font-size: 18px; margin-bottom: 20px;">正確率: <span id="accuracy-text">0%</span></div>
    <button class="next-btn" onclick="restartChallenge()">再試一次</button>
  </div>
</div>

<script>
  // 核心數據與邏輯 (保留原有的遊戲邏輯，僅針對 UI 反饋微調)
  const KANA_DATA = [['あ','ア','a'],['い','イ','i'],['う','ウ','u'],['え','エ','e'],['お','オ','o'],['か','カ','ka'],['き','キ','ki'],['く','ク','ku'],['け','ケ','ke'],['こ','コ','ko'],['さ','サ','sa'],['し','シ','shi'],['す','ス','su'],['せ','セ','se'],['そ','ソ','so'],['た','タ','ta'],['ち','チ','chi'],['つ','ツ','tsu'],['て','テ','te'],['と','ト','to'],['な','ナ','na'],['に','ニ','ni'],['ぬ','ヌ','nu'],['ね','ネ','ne'],['の','ノ','no'],['は','ハ','ha'],['ひ','ヒ','hi'],['ふ','フ','fu'],['へ','ヘ','he'],['ほ','ホ','ho'],['ま','馬','ma'],['み','ミ','mi'],['む','ム','mu'],['め','メ','me'],['も','モ','mo'],['や','ヤ','ya'],['ゆ','ユ','yu'],['よ','ヨ','yo'],['ら','ラ','ra'],['り','リ','ri'],['る','ル','ru'],['れ','レ','re'],['ろ','ロ','ro'],['わ','ワ','wa'],['を','ヲ','wo'],['ん','ン','n']];

  let state = {
    charMode: 'hiragana', isTyping: false, isListening: false, difficulty: 'easy',
    current: null, pool: [], correctCount: 0, wrongCount: 0, timer: null,
    currentTimeLimit: 10000, isAnswering: false, gameStarted: false, isPaused: false
  };

  function updateMode(m) { 
    state.charMode = m; 
    document.querySelectorAll('[id^="mode-"]').forEach(b => b.classList.remove('active'));
    document.getElementById(`mode-${m}`).classList.add('active');
    if(state.gameStarted) restartChallenge();
  }

  function updateFunc(f) {
    state[f === 'typing' ? 'isTyping' : 'isListening'] = !state[f === 'typing' ? 'isTyping' : 'isListening'];
    document.getElementById(`func-${f}`).classList.toggle('active');
    if(state.gameStarted) restartChallenge();
  }

  function updateDifficulty(d) {
    state.difficulty = d;
    state.currentTimeLimit = d === 'easy' ? 10000 : d === 'normal' ? 5000 : 3000;
    document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-difficulty="${d}"]`).classList.add('active');
    if(state.gameStarted) restartChallenge();
  }

  function startGame() {
    document.getElementById('start-overlay').classList.remove('active');
    state.gameStarted = true;
    document.getElementById('btn-pause').disabled = false;
    restartChallenge();
  }

  function togglePause() {
    state.isPaused = !state.isPaused;
    document.getElementById('pause-overlay').classList.toggle('active', state.isPaused);
    if (!state.isPaused && state.gameStarted) {
      // 簡單起見，暫停後恢復直接下一題或重啟計時
      if (!state.isAnswering) startTimer();
    } else {
      clearTimeout(state.timer);
    }
  }

  function restartChallenge() {
    state.correctCount = 0; state.wrongCount = 0;
    state.pool = [...KANA_DATA].sort(() => Math.random() - 0.5);
    state.isPaused = false;
    document.getElementById('modal-overlay').style.display = 'none';
    document.getElementById('pause-overlay').classList.remove('active');
    updateStats();
    generateQuestion();
  }

  function updateStats() {
    document.getElementById('stat-correct').textContent = state.correctCount;
    document.getElementById('stat-wrong').textContent = state.wrongCount;
    document.getElementById('progress-text').textContent = `${KANA_DATA.length - state.pool.length} / ${KANA_DATA.length}`;
  }

  function startTimer() {
    const bar = document.getElementById('timer-bar');
    bar.style.transition = 'none'; bar.style.width = '100%';
    setTimeout(() => {
      bar.style.transition = `width ${state.currentTimeLimit}ms linear`;
      bar.style.width = '0%';
    }, 50);
    clearTimeout(state.timer);
    state.timer = setTimeout(() => checkAnswer(false, true), state.currentTimeLimit);
  }

  function generateQuestion() {
    if (state.pool.length === 0) { showFinal(); return; }
    state.current = state.pool.pop();
    state.isAnswering = false;
    document.getElementById('next-button-wrapper').style.visibility = 'hidden';
    document.getElementById('result-message').textContent = '';
    
    const kanaDiv = document.getElementById('kana');
    const replayBtn = document.getElementById('replay-btn');
    
    if (state.isListening) {
      kanaDiv.textContent = '🔊';
      replayBtn.style.display = 'block';
      playVoice(state.current[0]);
    } else {
      replayBtn.style.display = 'none';
      kanaDiv.textContent = state.charMode === 'hiragana' ? state.current[0] : (state.charMode === 'katakana' ? state.current[1] : (Math.random() > 0.5 ? state.current[0] : state.current[1]));
    }

    if (state.isTyping) {
      document.getElementById('options-grid').style.display = 'none';
      document.getElementById('typing-wrapper').style.display = 'block';
      const input = document.getElementById('typing-input');
      input.value = ''; input.disabled = false; input.focus();
    } else {
      document.getElementById('options-grid').style.display = 'grid';
      document.getElementById('typing-wrapper').style.display = 'none';
      renderOptions();
    }
    startTimer();
    updateStats();
  }

  function renderOptions() {
    let opts = [state.current];
    while(opts.length < 4) {
      let r = KANA_DATA[Math.floor(Math.random()*KANA_DATA.length)];
      if(!opts.find(o => o[2] === r[2])) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);
    const grid = document.getElementById('options-grid');
    grid.innerHTML = '';
    opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.textContent = o[2];
      b.onclick = () => checkAnswer(o[2] === state.current[2]);
      grid.appendChild(b);
    });
  }

  function checkAnswer(isCorrect, isTimeout = false) {
    if (state.isAnswering) return;
    state.isAnswering = true;
    clearTimeout(state.timer);
    
    const msg = document.getElementById('result-message');
    if (isCorrect) {
      state.correctCount++;
      msg.textContent = '✨ 正確！';
      msg.style.color = 'var(--success-color)';
    } else {
      state.wrongCount++;
      msg.textContent = isTimeout ? `⏰ 超時！正確是 ${state.current[2]}` : `❌ 錯誤！正確是 ${state.current[2]}`;
      msg.style.color = 'var(--error-color)';
    }

    if (!state.isTyping) {
      document.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = true;
        if(b.textContent === state.current[2]) b.classList.add('correct');
      });
    } else {
      document.getElementById('typing-input').disabled = true;
    }

    document.getElementById('next-button-wrapper').style.visibility = 'visible';
    updateStats();
  }

  function nextQuestion() { generateQuestion(); }

  function showFinal() {
    document.getElementById('modal-overlay').style.display = 'flex';
    document.getElementById('final-correct').textContent = state.correctCount;
    const acc = Math.round((state.correctCount / KANA_DATA.length) * 100);
    document.getElementById('accuracy-text').textContent = acc + '%';
  }

  function playVoice(t) {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ja-JP'; u.rate = 0.5;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  function replayVoice() { playVoice(state.current[0]); }

  document.getElementById('typing-input').onkeypress = (e) => {
    if (e.key === 'Enter') checkAnswer(e.target.value.toLowerCase().trim() === state.current[2]);
  };
</script>

</body>
</html>
