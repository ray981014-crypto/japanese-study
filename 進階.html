<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日文五十音訓練 - 機率優化版</title>

<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #10b981;
    --primary: #6366f1;
    --text: #f8fafc;
    --secondary: #94a3b8;
  }

  body {
    background: radial-gradient(circle at top, #1e1b4b, #0f172a);
    color: var(--text);
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    width: 100%;
    max-width: 450px;
    padding: 25px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    text-align: center;
  }

  .button-group {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  button {
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    padding: 10px 16px;
    font-size: 0.9rem;
  }

  button.active { background: var(--primary); color: white; box-shadow: 0 0 12px rgba(99, 102, 241, 0.5); }
  .control-btn { background: #334155; }
  .control-btn.active { background: var(--accent); }

  .display-area {
    background: rgba(15, 23, 42, 0.5);
    border-radius: 20px;
    margin: 20px 0;
    padding: 20px;
  }

  .kana {
    font-size: 90px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #fff;
  }

  .sub-controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
  }

  .sub-btn {
    background: transparent;
    border: 1px solid var(--secondary);
    color: var(--secondary);
    padding: 5px 12px;
    font-size: 0.8rem;
  }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .option-btn {
    padding: 15px;
    border-radius: 15px;
    font-size: 1.2rem;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
  }

  input {
    padding: 12px;
    border-radius: 12px;
    border: 2px solid var(--primary);
    background: #0f172a;
    color: white;
    width: 80%;
    font-size: 1.1rem;
    text-align: center;
    outline: none;
  }

  #result { margin-top: 15px; height: 24px; font-weight: bold; }

  .chart-container { margin-top: 30px; width: 100%; max-width: 600px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: rgba(30, 41, 59, 0.5); font-size: 0.8rem; }
  th, td { padding: 8px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
</style>
</head>

<body>

<div class="container">
  <h2>五十音訓練 <span id="progress" style="font-size: 0.8rem; color: var(--secondary);"></span></h2>

  <div class="button-group">
    <button id="mode-hiragana" class="mode-btn active" onclick="updateMode('hiragana')">平假名</button>
    <button id="mode-katakana" class="mode-btn" onclick="updateMode('katakana')">片假名</button>
    <button id="mode-both" class="mode-btn" onclick="updateMode('both')">混合模式</button>
  </div>

  <div class="button-group">
    <button id="func-typing" class="control-btn" onclick="updateFunc('typing')">✍️ 打字</button>
    <button id="func-listening" class="control-btn" onclick="updateFunc('listening')">🔊 聽力</button>
  </div>

  <div class="display-area">
    <div class="kana" id="kana">...</div>
    <div class="sub-controls">
      <button class="sub-btn" onclick="replayVoice()">🔁 重聽</button>
      <button class="sub-btn" onclick="generateQuestion()">⏭️ 下一題</button>
    </div>
  </div>

  <div id="options" class="grid"></div>
  <div id="typingBox" style="display:none">
    <input id="typingInput" placeholder="輸入 Romaji..." autocomplete="off">
  </div>
  <div id="result"></div>
</div>

<div class="chart-container">
  <table id="fullChart">
    <tbody id="chartBody"></tbody>
  </table>
</div>

<script>
// 完整五十音數據
const fullData = [
  ['あ','ア','a'],['い','イ','i'],['う','ウ','u'],['え','エ','e'],['お','オ','o'],
  ['か','カ','ka'],['き','キ','ki'],['く','ク','ku'],['け','ケ','ke'],['こ','コ','ko'],
  ['さ','サ','sa'],['し','シ','shi'],['す','ス','su'],['せ','セ','se'],['そ','ソ','so'],
  ['た','タ','ta'],['ち','チ','chi'],['つ','ツ','tsu'],['て','テ','te'],['と','圖','to'],
  ['な','ナ','na'],['に','ニ','ni'],['ぬ','ヌ','nu'],['ね','ネ','ne'],['の','ノ','no'],
  ['は','ハ','ha'],['ひ','ヒ','hi'],['ふ','フ','fu'],['へ','ヘ','he'],['ほ','ホ','ho'],
  ['ま','マ','ma'],['み','ミ','mi'],['む','ム','mu'],['め','メ','me'],['も','モ','mo'],
  ['や','ヤ','ya'],['ゆ','ユ','yu'],['よ','ヨ','yo'],
  ['ら','ラ','ra'],['り','リ','ri'],['る','ル','ru'],['れ','レ','re'],['ろ','ロ','ro'],
  ['わ','ワ','wa'],['を','ヲ','wo'],['ん','ン','n']
];

let state = {
  charMode: 'hiragana',
  isTyping: false,
  isListening: false,
  current: null,
  pool: [] // 題目池
};

// 洗牌演算法 (Fisher-Yates Shuffle)
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// 刷新題目池：確保每一輪所有音都會出現一次
function refreshPool() {
  state.pool = shuffle([...fullData]);
}

function updateMode(m) {
  state.charMode = m;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`mode-${m}`).classList.add('active');
  refreshPool(); // 切換模式時重新洗牌
  generateQuestion();
}

function updateFunc(type) {
  if(type === 'typing') state.isTyping = !state.isTyping;
  if(type === 'listening') state.isListening = !state.isListening;
  document.getElementById('func-typing').classList.toggle('active', state.isTyping);
  document.getElementById('func-listening').classList.toggle('active', state.isListening);
  generateQuestion();
}

function generateQuestion() {
  if (state.pool.length === 0) refreshPool();
  
  // 從池子裡「拿走」一個音 (機率絕對平均)
  state.current = state.pool.pop();
  
  // 更新進度顯示
  document.getElementById('progress').textContent = `(${fullData.length - state.pool.length} / ${fullData.length})`;

  const kanaDiv = document.getElementById('kana');
  
  // 決定顯示內容
  if (state.isListening) {
    kanaDiv.textContent = '🔊';
    playVoice(state.current[0]);
  } else {
    if (state.charMode === 'hiragana') kanaDiv.textContent = state.current[0];
    else if (state.charMode === 'katakana') kanaDiv.textContent = state.current[1];
    else kanaDiv.textContent = Math.random() > 0.5 ? state.current[0] : state.current[1];
  }

  // 切換 UI
  if (state.isTyping) {
    document.getElementById('typingBox').style.display = 'block';
    document.getElementById('options').style.display = 'none';
    const input = document.getElementById('typingInput');
    input.value = '';
    input.focus();
  } else {
    document.getElementById('typingBox').style.display = 'none';
    document.getElementById('options').style.display = 'grid';
    renderOptions();
  }
  document.getElementById('result').textContent = '';
}

function renderOptions() {
  let opts = [state.current];
  while(opts.length < 4) {
    const r = fullData[Math.floor(Math.random() * fullData.length)];
    if(!opts.includes(r)) opts.push(r);
  }
  shuffle(opts);

  const container = document.getElementById('options');
  container.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = o[2];
    b.onclick = () => checkAnswer(o[2] === state.current[2]);
    container.appendChild(b);
  });
}

function checkAnswer(isCorrect) {
  const res = document.getElementById('result');
  if(isCorrect) {
    res.innerHTML = '<span style="color:var(--accent)">✅ 正確！</span>';
    setTimeout(generateQuestion, 800);
  } else {
    res.innerHTML = `<span style="color:#f43f5e">❌ 正解：${state.current[2]}</span>`;
  }
}

// 支援多種拼音寫法
function normalize(s) {
  return s.replace('si','shi').replace('tu','tsu').replace('ti','chi').replace('hu','fu');
}

function playVoice(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.35; 
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function replayVoice() { if(state.current) playVoice(state.current[0]); }

document.getElementById('typingInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const input = normalize(e.target.value.toLowerCase().trim());
    const target = normalize(state.current[2]);
    checkAnswer(input === target);
  }
});

// 初始化
refreshPool();
generateQuestion();

// 繪製表格略 (保持之前的邏輯)...
</script>
</body>
</html>
